[pytest]
testpaths = app/tests
# The suite is synchronous (FastAPI's TestClient), so pytest-asyncio is only
# present as a transitive dependency. Pinning the loop scope silences its
# "unset configuration option" warning and makes the default explicit rather
# than something that changes under us on a future upgrade.
asyncio_default_fixture_loop_scope = function

python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -q
    --strict-markers
    --tb=short
    -W ignore::DeprecationWarning
    -W ignore::PendingDeprecationWarning
filterwarnings =
    ignore:.*class-based `config`.*:DeprecationWarning
    ignore:.*Support for class-based.*:UserWarning
